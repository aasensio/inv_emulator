[project]
name = "mlp-bspline"
version = "0.1.0"
description = "B-spline + MLP emulator for Stokes profile synthesis from atmospheric stratifications"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "tqdm>=4.60",
    "matplotlib>=3.5",
    "nvitop>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlp_bspline*"]
